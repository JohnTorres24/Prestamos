spring.application.name=android

# Configuración de Conexión a Supabase
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.gfrbmsforynypamorybn
spring.datasource.password=0093215506Jhon
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.port=${PORT:8080}
# Limita el número máximo de conexiones simultáneas que Spring Boot abrirá con Supabase
spring.datasource.hikari.maximum-pool-size=3

# Tiempo máximo (en milisegundos) que Spring esperará para conseguir una conexión libre
spring.datasource.hikari.connection-timeout=30000

# Tiempo máximo que una conexión inactiva puede permanecer en el pool
spring.datasource.hikari.idle-timeout=10000